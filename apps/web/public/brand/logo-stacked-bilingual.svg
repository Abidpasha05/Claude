<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" fill="none" role="img" aria-label="Aklio أكليو">
  <title>Aklio أكليو</title>
  <!-- Mark centred -->
  <g transform="translate(48,12)">
    <path d="M 32 6 L 24 54 L 10 54 Z" fill="#0f172a"/>
    <path d="M 32 6 L 54 54 L 40 54 Z" fill="#0f172a"/>
    <rect x="18" y="31" width="28" height="6" rx="1.5" fill="#f59e0b"/>
  </g>
  <!-- Latin wordmark -->
  <text x="80" y="124" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="800"
        fill="#0f172a" letter-spacing="-1.2">Aklio</text>
  <!-- Arabic wordmark -->
  <text x="80" y="160" text-anchor="middle" direction="rtl"
        font-family="'Cairo','Tajawal',system-ui,sans-serif" font-size="28" font-weight="700"
        fill="#f59e0b">أكليو</text>
  <!-- Tagline -->
  <text x="80" y="195" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600"
        fill="#475569" letter-spacing="1">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none" role="img" aria-label="Arkan">
  <title>Arkan — From kitchen to customer, all in one</title>
  <!-- Mark (scaled to 64×64 fit at left) -->
  <g transform="translate(8,8)">
    <rect x="6" y="14" width="52" height="7" rx="3.5" fill="#ea580c"/>
    <rect x="10" y="21" width="7" height="32" rx="2" fill="#ea580c"/>
    <rect x="22" y="21" width="7" height="32" rx="2" fill="#ea580c"/>
    <rect x="35" y="21" width="7" height="32" rx="2" fill="#ea580c"/>
    <rect x="47" y="21" width="7" height="32" rx="2" fill="#ea580c"/>
    <rect x="6" y="53" width="52" height="7" rx="3.5" fill="#ea580c"/>
    <circle cx="32" cy="37" r="2.5" fill="#fb923c"/>
  </g>
  <!-- Wordmark -->
  <text x="90" y="46" font-family="Inter, system-ui, -apple-system, sans-serif"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" fill="none" role="img" aria-label="Arkan">
  <title>Arkan أركان</title>
  <!-- Mark centred -->
  <g transform="translate(48,8)">
    <rect x="6" y="14" width="52" height="7" rx="3.5" fill="#ea580c"/>
    <rect x="10" y="21" width="7" height="32" rx="2" fill="#ea580c"/>
    <rect x="22" y="21" width="7" height="32" rx="2" fill="#ea580c"/>
    <rect x="35" y="21" width="7" height="32" rx="2" fill="#ea580c"/>
    <rect x="47" y="21" width="7" height="32" rx="2" fill="#ea580c"/>
    <rect x="6" y="53" width="52" height="7" rx="3.5" fill="#ea580c"/>
    <circle cx="32" cy="37" r="2.5" fill="#fb923c"/>
  </g>
  <!-- Latin wordmark -->
  <text x="80" y="116" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="800"
        fill="#1c1917" letter-spacing="-1.2">Arkan</text>
  <!-- Arabic wordmark -->
  <text x="80" y="150" text-anchor="middle" direction="rtl"
        font-family="'Cairo','Tajawal',system-ui,sans-serif" font-size="26" font-weight="700"
        fill="#ea580c">أركان</text>
  <!-- Tagline -->
  <text x="80" y="180" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500"
        fill="#78716c" letter-spacing="0.5">
    FROM KITCHEN TO CUSTOMER, ALL IN ONE.
  </text>
</svg>
